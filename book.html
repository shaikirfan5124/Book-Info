<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Book Information</h1>
    </header>

    <main>

        <div class="details-card">

            <h2 id="book-title"></h2>

            <p>
                <strong>Author:</strong>
                <span id="author"></span>
            </p>

            <p>
                <strong>Category:</strong>
                <span id="category"></span>
            </p>

            <h3>Description</h3>

            <p id="description"></p>

            <a href="index.html" class="back-button">
                ← Back to Home
            </a>

        </div>

    </main>

    <footer>
        <p>© 2026 Book Information System</p>
    </footer>

    <script>

        const books = {

            java: {
                title: "Java Programming",
                author: "James Gosling",
                category: "Object-Oriented Programming",
                description:
                    "Java is a popular object-oriented programming language used to develop web applications, mobile applications, desktop applications and enterprise software."
            },

            python: {
                title: "Python Programming",
                author: "Guido van Rossum",
                category: "Programming",
                description:
                    "Python is a high-level programming language known for its simple syntax. It is widely used in web development, automation, data science and software development."
            },

            c: {
                title: "C Programming",
                author: "Dennis Ritchie",
                category: "Procedural Programming",
                description:
                    "C is a powerful procedural programming language. It is commonly used for system programming, operating systems, embedded systems and application development."
            },

            cpp: {
                title: "C++ Programming",
                author: "Bjarne Stroustrup",
                category: "Object-Oriented Programming",
                description:
                    "C++ is a general-purpose programming language that supports procedural, object-oriented and generic programming."
            }

        };

        const params = new URLSearchParams(window.location.search);

        const selectedBook = params.get("book");

        if (books[selectedBook]) {

            document.getElementById("book-title").textContent =
                books[selectedBook].title;

            document.getElementById("author").textContent =
                books[selectedBook].author;

            document.getElementById("category").textContent =
                books[selectedBook].category;

            document.getElementById("description").textContent =
                books[selectedBook].description;

        } else {

            document.getElementById("book-title").textContent =
                "Book Not Found";

            document.getElementById("description").textContent =
                "The selected book does not exist.";

        }

    </script>

</body>
</html>
